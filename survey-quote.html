<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استبيان العملاء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B2F3A;--mut:#5B7480;--bg:#EEF4F5;--card:#fff;--line:#D5E2E5;--teal:#0F8F7E;--tealbg:#E3F4F1;--red:#C9372F;--redbg:#FDECEA;--star:#F2A516}
@media (prefers-color-scheme:dark){:root{--ink:#E8F1F3;--mut:#9DB4BC;--bg:#0A1A20;--card:#112A33;--line:#24424D;--teal:#2FC4AE;--tealbg:#123C3A;--red:#FF7A70;--redbg:#3A1C1B;--star:#F7B93B}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Tajawal",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:17px}
header{background:#274C5A;color:#fff;padding:28px 20px 56px;text-align:center;position:relative;overflow:hidden}
.logo{width:96px;height:104px;border-radius:22px;background:#fff;margin:0 auto 14px;display:grid;place-items:center;overflow:hidden;color:#274C5A;font-weight:700;font-size:13px;padding:8px}
.logo img{width:100%;height:100%;object-fit:contain}
header h1{margin:0;font-size:24px;font-weight:700}
header p{margin:6px auto 0;max-width:460px;color:#BFDCE0;font-size:15px}
.ecg{position:absolute;inset:auto 0 0 0;height:36px;width:100%;opacity:.35}
main{position:relative;z-index:1;max-width:640px;margin:-34px auto 40px;padding:0 14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.q h2{margin:0 0 12px;font-size:17px;font-weight:500}
.q h2 small{color:var(--mut);font-weight:400;font-size:13px}
.stars{display:flex;gap:6px;direction:ltr;justify-content:center}
.stars button{flex:1;max-width:84px;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:8px 0 6px;cursor:pointer;color:var(--mut);font:inherit;transition:.15s}
.stars button svg{width:28px;height:28px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.6}
.stars button span{font-size:12px}
.stars button.on{border-color:var(--star);color:var(--star);background:color-mix(in srgb,var(--star) 12%,transparent)}
.stars button.on svg{fill:var(--star)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.reason{display:none;margin-top:12px}
.reason.show{display:block}
.reason label{display:block;font-size:14px;color:var(--red);margin-bottom:6px;font-weight:500}
textarea{width:100%;min-height:92px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.reason textarea{border-color:var(--red);background:var(--redbg)}
.choices{display:grid;gap:10px}
.choices button{display:flex;align-items:center;gap:12px;text-align:start;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;cursor:pointer;transition:.15s}
.choices button i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.choices button.on{border-color:var(--teal);background:var(--tealbg)}
.choices button.on i{border-color:var(--teal)}
.choices button.on i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal)}
.yn{grid-template-columns:1fr 1fr}
.yn button{justify-content:center}
.yn button.on.yes{border-color:var(--red);background:var(--redbg)}
.yn button.on.yes i{border-color:var(--red)}
.yn button.on.yes i::after{background:var(--red)}
.submit{width:100%;border:0;border-radius:14px;background:var(--teal);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:15px;cursor:pointer;margin-top:4px}
.submit:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:14px;text-align:center;min-height:22px;margin:8px 0 0}
.done{text-align:center;padding:36px 20px}
.done .tick{width:68px;height:68px;border-radius:50%;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;margin:0 auto 14px;font-size:34px}
.done h2{margin:0 0 6px;font-size:22px}
.done p{margin:0;color:var(--mut)}
.hide{display:none}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <svg class="ecg" viewBox="0 0 600 36" preserveAspectRatio="none"><path d="M0 18h200l12-14 14 28 12-14h60l10-10 12 20 10-10h270" fill="none" stroke="#7FD1C4" stroke-width="2"/></svg>
</header>
<main>
  <div id="form"></div>
  <div class="q done hide" id="done">
    <div class="tick">✓</div>
    <h2>شكراً لك، وصلنا رأيك</h2>
    <p>نقدّر وقتك، وملاحظتك تساعدنا نخدمك أفضل.</p>
  </div>
</main>

  FLOW_URL: ""     // رابط Power Automate (HTTP POST URL) — يوضع هنا بعد إنشاء المسار
};
/* ================================================ */

const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" stroke-linejoin="round"/></svg>';
const LABELS = ["سيئ جداً","سيئ","مقبول","جيد","ممتاز"];

const SURVEYS = {
  service: {
    name: "استبيان تقييم الخدمة بعد النقل",
    title: "كيف كانت رحلتك معنا؟",
    sub: "ست أسئلة قصيرة تساعدنا نحسّن الخدمة.",
    items: [
      {id:"satisfaction", t:"ما مدى رضاك عن الخدمة؟", type:"stars"},
      {id:"staff", t:"كيف كان تعامل المسعفين والسائق؟", type:"stars"},
      {id:"punctuality", t:"ما تقييمك للالتزام بالوقت؟", type:"stars"},
      {id:"booking", t:"ما مدى سهولة إجراءات الحجز؟", type:"stars"},
      {id:"recommend", t:"هل تنصح الآخرين بخدماتنا؟", type:"stars", lo:"لا أنصح", hi:"أنصح بشدة"},
      {id:"issue", t:"هل واجهتك أي إشكالية خاصة بالنقل؟", type:"yesno"}
    ]
  },
  quote: {
    name: "متابعة العملاء الذين لم يكملوا الحجز",
    title: "نبي نسمع منك",
    sub: "وصلك عرض السعر ولم يتم الحجز، ما السبب؟ سؤال واحد فقط.",
    items: [
      {id:"reason", t:"ما سبب عدم إتمام الطلب؟", type:"choice",
       opts:["السعر","توقيت الخدمة","عدم الحاجة للخدمة","اخترت مزود خدمة آخر","سبب آخر"]}
    ]
  }
};

const qs = new URLSearchParams(location.search);
const key = "quote";
const S = SURVEYS[key];
const ref = qs.get("ref") || "";
const answers = {}, reasons = {};

document.title = S.name;
document.getElementById("title").textContent = S.title;
document.getElementById("sub").textContent = S.sub;
const logo = document.getElementById("logo");
if (CONFIG.LOGO) { const im = new Image(); im.src = CONFIG.LOGO; im.alt = CONFIG.COMPANY; logo.appendChild(im); }
else logo.textContent = "شعار الشركة";

const form = document.getElementById("form");
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function box(it){
  const q = mk("section","q"); q.appendChild(mk("h2","",it.t));
  const reason = mk("div","reason");
  const ta = mk("textarea"); ta.oninput = () => reasons[it.id] = ta.value;
  const lab = mk("label"); reason.append(lab, ta);

  if (it.type === "stars") {
    const row = mk("div","stars");
    for (let n = 1; n <= 5; n++) {
      const b = mk("button","", STAR + "<span>" + LABELS[n-1] + "</span>"); b.type = "button";
      b.setAttribute("aria-label", n + " من 5");
      b.onclick = () => {
        answers[it.id] = n;
        [...row.children].forEach((c,i) => c.classList.toggle("on", i < n));
        const low = n <= 2;
        lab.textContent = "نأسف لذلك، ما السبب؟";
        reason.classList.toggle("show", low);
        if (!low) { ta.value = ""; delete reasons[it.id]; }
      };
      row.appendChild(b);
    }
    q.appendChild(row);
    if (it.lo) q.appendChild(mk("div","scale","<span>" + it.hi + "</span><span>" + it.lo + "</span>"));
  }
  if (it.type === "yesno") {
    const row = mk("div","choices yn");
    [["نعم","yes"],["لا","no"]].forEach(([txt,c]) => {
      const b = mk("button", c, "<i></i>" + txt); b.type = "button";
      b.onclick = () => {
        answers[it.id] = txt;
        [...row.children].forEach(x => x.classList.toggle("on", x === b));
        lab.textContent = "اشرح لنا الإشكالية التي واجهتك";
        reason.classList.toggle("show", c === "yes");
        if (c === "no") { ta.value = ""; delete reasons[it.id]; }
      };
      row.appendChild(b);
    });
    q.appendChild(row);
  }
  if (it.type === "choice") {
    const row = mk("div","choices");
    it.opts.forEach((txt, i) => {
      const b = mk("button","", "<i></i>" + txt); b.type = "button";
      b.onclick = () => {
        answers[it.id] = txt;
        [...row.children].forEach(x => x.classList.toggle("on", x === b));
        const other = i === it.opts.length - 1;
        lab.style.color = "var(--ink)";
        lab.textContent = other ? "اكتب السبب" : "هل تحب تضيف تفاصيل؟ (اختياري)";
        reason.classList.add("show");
        ta.style.borderColor = ""; ta.style.background = "";
        reason.dataset.other = other ? "1" : "";
      };
      row.appendChild(b);
    });
    q.appendChild(row);
    reason.querySelector("textarea").style.cssText = "border-color:var(--line);background:var(--bg)";
  }
  q.appendChild(reason);
  q._reason = reason;
  return q;
}

S.items.forEach(it => form.appendChild(box(it)));
const err = mk("p","err"); const btn = mk("button","submit","إرسال التقييم"); btn.type = "button";
form.append(btn, err);

btn.onclick = async () => {
  err.textContent = "";
  for (const it of S.items) {
    if (answers[it.id] == null) { err.textContent = "فضلاً أجب عن السؤال: " + it.t; return; }
  }
  for (const it of S.items) {
    const needs = (it.type === "stars" && answers[it.id] <= 2) || (it.type === "yesno" && answers[it.id] === "نعم") ||
      (it.type === "choice" && answers[it.id] === it.opts[it.opts.length-1]);
    if (needs && !(reasons[it.id] || "").trim()) { err.textContent = "فضلاً اكتب التفاصيل في الخانة الظاهرة"; return; }
  }
  const payload = {
    survey: S.name, company: CONFIG.COMPANY, ref: ref,
    submittedAt: new Date().toLocaleString("ar-SA"),
    answers: S.items.map(it => ({ question: it.t, answer: answers[it.id], details: (reasons[it.id] || "").trim() })),
    hasLowRating: S.items.some(it => it.type === "stars" && answers[it.id] <= 2)
  };
  payload.summary = payload.answers.map(a => "• " + a.question + " → " + a.answer + (a.details ? " (" + a.details + ")" : "")).join("<br>");
  payload.a1=payload.a2=payload.a3=payload.a4=payload.a5=payload.a6=payload.d1=payload.d2=payload.d3=payload.d4=payload.d5=payload.d6="";
  payload.answers.forEach((a,i) => { payload["a"+(i+1)] = String(a.answer); payload["d"+(i+1)] = a.details; });
  btn.disabled = true; btn.textContent = "جاري الإرسال...";
  try {
    if (!CONFIG.FLOW_URL) { console.log("وضع تجريبي، لم يُرسل شيء:", payload); }
    else {
      const r = await fetch(CONFIG.FLOW_URL, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error(r.status);
    }
    form.classList.add("hide"); document.getElementById("done").classList.remove("hide");
    scrollTo({top:0,behavior:"smooth"});
  } catch (e) {
    err.textContent = "تعذّر الإرسال، حاول مرة أخرى بعد قليل.";
    btn.disabled = false; btn.textContent = "إرسال التقييم";
  }
};
</script>
